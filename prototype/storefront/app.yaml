# yaml-language-server: $schema=https://raw.githubusercontent.com/northcutted/clearcutt-factory/main/schemas/manifest.schema.json
# storefront (web team): a Node.js 24 TypeScript HTTP service on stack node:1.
apiVersion: factory.clearcutt.dev/v1alpha1
kind: App
metadata:
  name: storefront
spec:
  stack: localhost:5001/stacks/node:1
  exclude: [app.lock.yaml, app.Containerfile, factory.org.yaml, node_modules, dist]
  labels:
    org.opencontainers.image.source: https://github.com/clearcutt-showcase/storefront
    org.opencontainers.image.description: Storefront (Node.js 24 TypeScript, stack node:1)
  test:
    http: {port: 8080, path: /healthz}
    timeout: 120s
