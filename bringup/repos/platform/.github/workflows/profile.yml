# Publishes the shared org profile (org/profile.yaml, with org/trust.yaml) as
# <REGISTRY>/factory/org:1 and signs it keylessly as this workflow:
#
#   https://github.com/<OWNER>/<PREFIX>platform/.github/workflows/profile.yml@refs/heads/main
#
# which is the signer every app repository's factory.org.yaml names in
# extends.signer, and org/profile.yaml in signing.profile. Keep it a workflow
# file of its own for that identity to hold. An unchanged profile only moves
# its tag.
#
# Output: published, [{kind: profile, …}] when it was newly pushed, else [].
name: profile
on:
  workflow_call:
    outputs:
      published:
        description: The newly pushed profile, a JSON array for notify.yml
        value: ${{ jobs.push.outputs.published }}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing
    outputs:
      published: ${{ steps.push.outputs.published == 'true' && format('[{{"kind":"profile","image":"{0}","repository":"{1}","digest":"{2}","tags":["1"]}}]', steps.push.outputs.image, steps.push.outputs.repository, steps.push.outputs.digest) || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: northcutted/clearcutt-factory@<FACTORY_REF>
        with:
          tools: "false"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and sign the shared profile
        id: push
        run: clearcutt-factory profile push -f org/profile.yaml --ref <REGISTRY>/factory/org:1
