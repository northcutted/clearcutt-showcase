# yaml-language-server: $schema=https://raw.githubusercontent.com/northcutted/clearcutt-factory/main/schemas/org.schema.json
# Org profile for the platform repository's own images (images/*/image.yaml)
# and stacks (stacks/*.yaml). It extends the shared profile this repository
# publishes (org/profile.yaml, with org/trust.yaml) by path, so the platform
# builds under exactly what every app repository extends: builder, signing
# and trust, the vulnerability gate, and policy. Each lock pins it as
# profile: {path, digest}, the digest profile push publishes it at.
apiVersion: factory.clearcutt.dev/v1alpha1
kind: OrgProfile

extends:
  path: org/profile.yaml

registry: <REGISTRY>/platform
# Platform images carry line tags only (metadata.tags in each image.yaml), no latest.
tags: []

defaults:
  base: cgr.dev/chainguard/wolfi-base:latest
