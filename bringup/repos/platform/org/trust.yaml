# yaml-language-server: $schema=https://raw.githubusercontent.com/northcutted/clearcutt-verify/main/contract/trust-policy.v1.schema.json
# Whose signatures <ORG> accepts, and for what (plan §4). One file, read by
# clearcutt-factory (signing.trustPolicy in factory.org.yaml and in the shared
# profile, org/profile.yaml) and by clearcutt-verify (the showcase repository's
# estate/policy.yaml), so building, rebasing, and verifying the estate trust
# the same signers.
apiVersion: clearcutt.dev/v1
kind: TrustPolicy
signers:
  # Images, built (images.yml) or rebased (fleet.yml). Inside a reusable
  # workflow the certificate names the called workflow, which anyone can call,
  # so the signature must also come from a run in one of <ORG>'s repositories,
  # in the repository the image names as its source
  # (org.opencontainers.image.source), on main.
  - name: factory-builds
    roles: [image]
    identityRegexp: ^https://github\.com/northcutted/clearcutt-factory/\.github/workflows/(images|fleet)\.yml@<FACTORY_SIGNER_REF>$
    issuer: https://token.actions.githubusercontent.com
    sourceRepositoryOwner: https://github.com/<ORG>
    sourceMatchesImage: true
    sourceRef: refs/heads/main
  # Stacks: only the platform's own stacks workflow, on main.
  - name: platform-stacks
    roles: [stack]
    identity: https://github.com/<ORG>/platform/.github/workflows/stacks.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
