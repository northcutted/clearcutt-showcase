# yaml-language-server: $schema=https://raw.githubusercontent.com/northcutted/clearcutt-factory/main/schemas/org.schema.json
# The shared org profile: what every <NAME> repository builds with. Published
# as <REGISTRY>/factory/org:1 by .github/workflows/profile.yml (which signs
# it), together with trust.yaml. Each app repository's factory.org.yaml
# extends it, adds its registry, and may only tighten the gate and policy
# (clearcutt-factory #50, docs/adopting.md §6).
#
# It leaves out what differs per repository: registry, tags, and the base
# image. The platform's own factory.org.yaml extends it by path, so the
# platform builds under it too.
apiVersion: factory.clearcutt.dev/v1alpha1
kind: OrgProfile

defaults:
  platforms: [linux/amd64, linux/arm64]
  labels:
    org.opencontainers.image.vendor: <NAME>

builder:
  buildkit: moby/buildkit:v0.33.1
  frontend: docker/dockerfile:1
  toolbox: cgr.dev/chainguard/wolfi-base:latest

signing:
  mode: keyless                 # Sigstore, with each workflow run's OIDC identity
  trustPolicy: trust.yaml       # image and stack signers, shared with clearcutt-verify
  profile:                      # who signs this profile (profile push checks it; apps pin it in extends.signer)
    certificateIdentity: https://github.com/<OWNER>/<PREFIX>platform/.github/workflows/profile.yml@refs/heads/main
    certificateOIDCIssuer: https://token.actions.githubusercontent.com

vulnerabilities:
  scanner: grype
  failOn: critical
  onlyFixed: true               # don't block on CVEs nobody can fix yet

policy:
  requireNonRoot: true
  requiredLabels: [org.opencontainers.image.source]
  requireSignedStacks: true
  allowTOFU: false
  allowedRegistries: [cgr.dev/chainguard/, <REGISTRY>/, docker.io/moby/, docker.io/docker/]
