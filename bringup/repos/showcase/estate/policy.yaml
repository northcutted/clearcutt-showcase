# What every image in estate/refs.txt must prove (plan §7). Run by
# .github/workflows/estate.yml.
apiVersion: clearcutt.dev/v1
kind: VerificationPolicy
# Provenance too: since clearcutt-factory v0.2.0 (#52) fleet.yml attests SLSA
# provenance for every image it rebases, as images.yml does for builds, so the
# fleet's steady state (rebased apps) meets it. A rebased image's recipe is
# not-applicable: its verified rebase record leads to the original's.
required: [signature, sbom, vulnerabilityScan, provenance, recipe]
# The platform's trust policy, the same signed copy factory builds and
# rebases with: estate.yml pulls the shared profile <REGISTRY>/factory/org:1,
# checks it is signed by the platform's profile.yml on main, and unpacks it
# into estate/.profile.
trustPolicy: .profile/trust-policy.yaml
failOn: critical
onlyFixed: true
maxDaysBehind: 7
# estate.yml runs --rescan: grype scans each image's verified SBOMs again
# with today's database, and the policy gates on the worse of that scan and
# the one the publisher attested (scanSource: worst, the default with
# --rescan). A rescan's age is its database's: older than 7 days leaves the
# image unverified, as an image no rescan could cover is.
maxScanAgeDays: 7
