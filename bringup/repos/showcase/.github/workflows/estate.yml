# Verifies the <ORG> estate with clearcutt-verify and publishes it with
# clearcutt-portal to GitHub Pages (plan §7): daily (after the apps' daily fleet
# runs), whenever a platform or app repository publishes or rebases
# (clearcutt.estate-changed), and by hand.
#
#   1. Pull the last report bundle from ghcr.io/<ORG>/estate:latest, so this
#      run extends its history (--allow-missing: only "nothing there yet", the
#      first run, may pass).
#   2. estate verify over estate/refs.txt against estate/policy.yaml and the
#      platform's trust policy; --reproduce rebuilds any factory image that
#      has no verified reproduction attestation.
#   3. Push the new bundle back and sign it, also when the gate fails (that
#      is the run to look at); upload it for the portal.
#   4. clearcutt-portal's reusable workflow builds the site and deploys it to
#      https://<ORG>.github.io/showcase/ (Pages source: GitHub Actions).
name: estate
on:
  schedule:
    - cron: "17 7 * * *" # daily, after the apps' fleet runs (05:41)
  repository_dispatch:
    types: [clearcutt.estate-changed]
  workflow_dispatch:
permissions:
  contents: read
# One run at a time: each extends the history the last one pushed. A newer
# run waits; a burst of dispatches costs at most one more run.
concurrency:
  group: estate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # estate push (and reading the packages)
      id-token: write # sign the pushed bundle
    outputs:
      bundle: ${{ steps.bundle.outputs.present }}
    env:
      ESTATE: ghcr.io/<ORG>/estate:latest
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # clearcutt-verify reads it for ghcr.io
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The trust policy is the platform's (org/trust.yaml), so the estate
      # trusts exactly whom factory trusts. estate/policy.yaml names it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/platform
          path: estate/.platform
          sparse-checkout: org
          persist-credentials: false
      # clearcutt-factory, for --reproduce (and QEMU for the other platform).
      - uses: northcutted/clearcutt-factory@<FACTORY_REF>
        with:
          tools: "false"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # Installs cosign and a signature-verified clearcutt-verify release.
      - uses: northcutted/clearcutt-verify@<VERIFY_REF>
        with:
          version: <VERIFY_VERSION>
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the last report bundle
        run: clearcutt-verify estate pull "$ESTATE" --output dist/estate --allow-missing

      # Exit 0: every image meets the policy; 2: one falls short (the report
      # says which and why); anything else: verification couldn't run, and
      # dist/estate still holds only the last run's bundle.
      - name: Verify the estate
        id: verify
        run: |
          set +e
          clearcutt-verify estate verify --refs estate/refs.txt --policy estate/policy.yaml \
            --name <ORG> --out dist/estate --platforms linux/amd64,linux/arm64 \
            --reproduce --fail-on failed
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Is there a new report?
        id: bundle
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ steps.verify.outputs.code }}
        run: |
          if { [ "$CODE" = 0 ] || [ "$CODE" = 2 ]; } && [ -f dist/estate/estate-report.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the bundle and sign it
        if: ${{ !cancelled() && steps.bundle.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          clearcutt-verify estate push "$ESTATE" --dir dist/estate \
            --file estate-report.json --file estate-history.json \
            --generated-at "$(jq -r .metadata.generatedAt dist/estate/estate-report.json)" | tee "$RUNNER_TEMP/push.out"
          digest=$(sed -n 's/^\[estate\] digest \(sha256:[0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/push.out")
          if [ -z "$digest" ]; then
            echo "::error::estate push printed no digest"
            exit 1
          fi
          cosign sign --yes "${ESTATE%:*}@$digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.bundle.outputs.present == 'true' }}
        with:
          name: estate-bundle
          path: |
            dist/estate/estate-report.json
            dist/estate/estate-history.json
          if-no-files-found: error

  # Also when the gate failed: the site shows why.
  portal:
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.bundle == 'true' }}
    uses: northcutted/clearcutt-portal/.github/workflows/portal.yml@<PORTAL_REF>
    permissions: {contents: read, pages: write, id-token: write}
    with:
      bundle-artifact: estate-bundle
      title: <ORG> estate
      portal-version: <PORTAL_REF>
