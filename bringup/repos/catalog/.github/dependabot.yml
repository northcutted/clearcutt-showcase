# Dependabot: the app's own dependencies (pip in /catalog), and the actions and
# ClearCutt reusable workflows this repository pins. factory's locks cover
# the OS packages and toolchains (fleet.yml and update-locks.yml); this
# covers what factory doesn't: a CVE in the app's own dependencies. With
# Dependabot security updates on (bringup.sh turns them on), a fix for a
# vulnerable dependency arrives as a pull request without waiting for the
# schedule.
#
# The ClearCutt pins (clearcutt-factory, -verify, -portal) are grouped so
# they move together; the trust policy accepts any factory release tag, so
# a factory bump keeps images verifiable.
version: 2
updates:
  - package-ecosystem: pip
    directory: /catalog
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      clearcutt:
        patterns: ["northcutted/clearcutt-*"]
      actions:
        patterns: ["*"]
